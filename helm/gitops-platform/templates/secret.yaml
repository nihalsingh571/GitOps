apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
type: Opaque
# Secrets store values as base64. This is NOT encryption — it's encoding.
# Why use Secrets at all then? Because:
#   1. kubectl get secret requires explicit access (RBAC-controlled)
#   2. They're excluded from `kubectl get all` output by default
#   3. They integrate with Vault, Sealed Secrets, and External Secrets Operator
# In production, never commit plaintext passwords to Git.
# Use: Sealed Secrets (kubeseal) or External Secrets Operator.
stringData:
  # stringData lets us write plaintext — Helm/Kubernetes auto-base64 encodes it
  POSTGRES_DB:       {{ .Values.db.name | quote }}
  POSTGRES_USER:     {{ .Values.db.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  # The backend reads these same keys as env vars via envFrom.secretRef
  DB_NAME:           {{ .Values.db.name | quote }}
  DB_USER:           {{ .Values.db.user | quote }}
  DB_PASS:           {{ .Values.db.password | quote }}
