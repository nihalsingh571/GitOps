apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
spec:
  # ClusterIP = only reachable from inside the cluster.
  # The frontend's NGINX proxies /api/* to this service by DNS name "backend".
  # CoreDNS resolves "backend" → "backend.gitops-app.svc.cluster.local"
  type: {{ .Values.backend.service.type }}
  selector:
    # Selects pods with label app=backend (our Deployment's pods).
    # Kubernetes automatically removes NotReady pods from this selector's
    # endpoint list (this is how readiness probes affect traffic routing).
    app: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http   # references the named port in the Deployment
      protocol: TCP
