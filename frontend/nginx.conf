# NGINX config for the frontend container
# Serves static HTML on port 80 AND reverse-proxies /api/* to the backend service

server {
    listen 80;
    server_name _;

    # Serve static files from /usr/share/nginx/html
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend Kubernetes service
    # In K8s: "backend" resolves via CoreDNS to the backend ClusterIP Service
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Health check endpoint for the frontend container's own liveness probe
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
